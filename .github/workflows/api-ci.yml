name: API CI/CD

on:
  push:
    branches:
      - main
      - master
      - deployment
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run Django checks
        run: python manage.py check

      - name: Run test suite
        run: python manage.py test --verbosity 2

  deploy:
    name: Deploy to cPouta VM
    runs-on: ubuntu-latest
    environment: deployment
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployment'

    steps:
      - name: Prepare SSH private key
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_PRIVATE_KEY_B64: ${{ secrets.VM_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${VM_SSH_PRIVATE_KEY_B64:-}" ]; then
            printf '%s' "$VM_SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' > ~/.ssh/id_vm_deploy
          elif [ -n "${VM_SSH_PRIVATE_KEY:-}" ]; then
            KEY_CONTENT="${VM_SSH_PRIVATE_KEY}"
            if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
              KEY_CONTENT="$(printf '%s' "$KEY_CONTENT" | sed 's/\\n/\n/g')"
            fi
            printf '%s\n' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/id_vm_deploy
          else
            echo "Missing SSH key secret. Set VM_SSH_PRIVATE_KEY_B64 (recommended) or VM_SSH_PRIVATE_KEY."
            exit 1
          fi
          chmod 600 ~/.ssh/id_vm_deploy
          if ! grep -Eq "BEGIN (OPENSSH|RSA|EC|DSA|PRIVATE) PRIVATE KEY" ~/.ssh/id_vm_deploy; then
            echo "SSH private key format is invalid. Use an OpenSSH private key."
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/id_vm_deploy >/dev/null 2>&1; then
            echo "Unable to parse SSH key. Re-save the key in GitHub secrets, or use VM_SSH_PRIVATE_KEY_B64."
            exit 1
          fi

      - name: Preflight VM connectivity
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          set -euo pipefail
          PORT="${VM_PORT:-22}"
          if [ -z "${VM_HOST:-}" ]; then
            echo "VM_HOST secret is empty. Set VM_HOST in the deployment environment secrets."
            exit 1
          fi
          echo "Testing TCP connectivity to ${VM_HOST}:${PORT} from GitHub runner..."
          if command -v nc >/dev/null 2>&1; then
            if ! nc -vz -w 8 "$VM_HOST" "$PORT"; then
              echo "Cannot reach ${VM_HOST}:${PORT} from this runner."
              echo "Check floating IP, security groups, and external SSH access for GitHub-hosted runners."
              exit 1
            fi
          else
            if ! timeout 8 bash -c "cat < /dev/null > /dev/tcp/${VM_HOST}/${PORT}"; then
              echo "Cannot reach ${VM_HOST}:${PORT} from this runner."
              echo "Check floating IP, security groups, and external SSH access for GitHub-hosted runners."
              exit 1
            fi
          fi
          echo "Connectivity preflight passed."

      - name: Configure SSH known_hosts
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${VM_HOST:-}" ]; then
            echo "VM_HOST secret is empty. Set VM_HOST in the deployment environment secrets."
            exit 1
          fi
          if [ -n "$VM_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            PORT="${VM_PORT:-22}"
            if ! ssh-keyscan -H -T 15 -p "$PORT" "$VM_HOST" > ~/.ssh/known_hosts; then
              echo "ssh-keyscan failed for ${VM_HOST}:${PORT}."
              echo "Set VM_KNOWN_HOSTS secret explicitly, or verify VM_HOST/VM_PORT and network access from GitHub runners."
              exit 1
            fi
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "ssh-keyscan returned no host keys for ${VM_HOST}:${PORT}."
              echo "Set VM_KNOWN_HOSTS secret explicitly with ssh-keyscan output."
              exit 1
            fi
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Pull latest deployment branch on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
          VM_GIT_BRANCH: ${{ secrets.VM_GIT_BRANCH }}
        run: |
          set -euo pipefail
          PORT="${VM_PORT:-22}"
          BRANCH="${VM_GIT_BRANCH:-deployment}"
          ssh -i ~/.ssh/id_vm_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "${VM_USER}@${VM_HOST}" "set -euo pipefail; cd '${VM_DEPLOY_PATH}'; test -d .git; git fetch origin '${BRANCH}'; git checkout '${BRANCH}'; git pull --ff-only origin '${BRANCH}'"

      - name: Rebuild and restart Docker container
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
          VM_DOCKER_IMAGE: ${{ secrets.VM_DOCKER_IMAGE }}
          VM_CONTAINER_NAME: ${{ secrets.VM_CONTAINER_NAME }}
          VM_DOCKER_RUN_ARGS: ${{ secrets.VM_DOCKER_RUN_ARGS }}
          VM_DOCKER_BUILD_CONTEXT: ${{ secrets.VM_DOCKER_BUILD_CONTEXT }}
          VM_DOCKERFILE: ${{ secrets.VM_DOCKERFILE }}
        run: |
          set -euo pipefail
          PORT="${VM_PORT:-22}"
          IMAGE="${VM_DOCKER_IMAGE:-eyesedge-api:latest}"
          CONTAINER="${VM_CONTAINER_NAME:-eyesedge-api}"
          BUILD_CONTEXT="${VM_DOCKER_BUILD_CONTEXT:-.}"
          RUN_ARGS="${VM_DOCKER_RUN_ARGS:--d --restart unless-stopped -p 8000:8000}"
          DOCKERFILE_ARG=""
          if [ -n "${VM_DOCKERFILE:-}" ]; then
            DOCKERFILE_ARG="-f ${VM_DOCKERFILE}"
          fi
          ssh -i ~/.ssh/id_vm_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "${VM_USER}@${VM_HOST}" "set -euo pipefail; cd '${VM_DEPLOY_PATH}'; docker build ${DOCKERFILE_ARG} -t '${IMAGE}' '${BUILD_CONTEXT}'; docker rm -f '${CONTAINER}' 2>/dev/null || true; docker run --name '${CONTAINER}' ${RUN_ARGS} '${IMAGE}'"
